[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nocek"
description = "Identify bats from ultrasonic recordings, in your browser."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "kazek" }]
keywords = ["bats", "bioacoustics", "echolocation", "bat detector", "pippyg", "ultrasound"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: Polish",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Runtime dependencies are added by the stage that first needs them.
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    # BatDetect2 1.3.1 imports audioread, which newer librosa no longer pulls in.
    "audioread>=3.0",
    "batdetect2==1.3.1",
    # BattyBirdNET: the maintained TFLite runtime (2.1.2 is the first with
    # wheels for Windows), and the resampler to 256 kHz.
    "ai-edge-litert>=2.1.2",
    "soxr>=0.5",
    # Where application data and settings belong on each operating system.
    "platformdirs>=4",
    # The local web server.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",  # FastAPI's test client
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kazek/nocek"
Source = "https://github.com/kazek/nocek"
Issues = "https://github.com/kazek/nocek/issues"

[project.scripts]
nocek = "nocek.cli:main"

[tool.hatch.version]
path = "src/nocek/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nocek"]

[tool.hatch.build.targets.sdist]
# The screenshots are for the repository's front page; the package does without them.
exclude = ["/docs/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Third-party packages that ship without type information.
module = ["soundfile", "batdetect2.*", "torch", "soxr", "ai_edge_litert.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that load a real model are slow; run them with `pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = ["slow: loads a real model"]
